[project]
name = "dashboard-builder"
version = "0.1"
description = "Builder for a static dashboard HTML page from YAML config"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
dashboard-builder = "dashboard_builder.cli:main"
